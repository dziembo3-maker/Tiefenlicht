<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="joy"><div id="knob"></div></div>

  <div id="hint"></div>
  <div id="grab" data-t="grab_mouse"></div>
  <div id="note"></div>
  <div id="fps"></div>

</div>
